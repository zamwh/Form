<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZamZam WH</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --text:var(--tg-theme-text-color,#111111);
  --hint:var(--tg-theme-hint-color,#8a8a8e);
  --sec:var(--tg-theme-secondary-bg-color,#f2f2f7);
  --btn:var(--tg-theme-button-color,#2a7ae2);
  --btnt:var(--tg-theme-button-text-color,#ffffff);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--sec);color:var(--text);padding-bottom:30px}
header{padding:20px 16px 8px;text-align:center}
h1{font-size:21px;margin:0}
.sub{color:var(--hint);font-size:13px;margin-top:5px}
.sec{background:var(--bg);margin:12px;border-radius:14px;padding:4px 14px}
.st{font-size:13px;color:var(--hint);margin:12px 0 4px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(128,128,128,.15);gap:12px}
.row:last-child{border-bottom:none}
label{flex:1;font-size:16px;line-height:1.35}
.u{font-size:12px;color:var(--hint);display:block;margin-top:2px}
input{width:112px;font-size:21px;padding:9px 6px;border-radius:10px;border:1.5px solid rgba(128,128,128,.35);background:var(--sec);color:var(--text);text-align:center;outline:none}
input:focus{border-color:var(--btn)}
input.err{border-color:#e53935;background:rgba(229,57,53,.08)}
.msg{color:#e53935;text-align:center;font-size:14px;min-height:20px;margin:8px 16px}
.fallback{display:none;margin:12px;padding:15px;width:calc(100% - 24px);font-size:17px;font-weight:600;border:0;border-radius:12px;background:var(--btn);color:var(--btnt)}
</style>
</head>
<body>
<header><h1 id="title"></h1><div class="sub" id="sub" dir="ltr"></div></header>
<div id="form"></div>
<div class="msg" id="msg"></div>
<button class="fallback" id="fb"></button>
<script>
var tg = window.Telegram && window.Telegram.WebApp;
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var D={"L": {"ar": {"pp": ["ماء 5 لتر مغلف - طبليات", "طبلية"], "pl": ["ماء 5 لتر مغلف - عبوات منفردة", "عبوة"], "rp": ["ماء خام - طبليات", "طبلية"], "zp": ["طبليات مصنع زمزم", "طبلية"], "zi": ["فواصل مصنع زمزم", "فاصل"], "dwg": ["دامج الماء - الجروبات", "عبوة"], "dwf": ["دامج الماء - المصنع 📷", "عبوة"], "dcg": ["دامج الكرتون - الجروبات", "حبة"], "dcf": ["دامج الكرتون - المصنع 📷", "حبة"], "dbg": ["دامج الأكياس - الجروبات", "حبة"], "dbf": ["دامج الأكياس - المصنع 📷", "حبة"], "bags": ["أكياس بلاستيك", "حبة"], "tape": ["شريط لاصق", "رول"], "roll": ["رول بلاستيك", "رول"], "pal_z": ["طبليات فارغة (مصنع زمزم)", "حبة"], "int_z": ["فواصل (مصنع زمزم)", "حبة"], "pal_m": ["طبليات فارغة (المصباح)", "حبة"], "int_m": ["فواصل (المصباح)", "حبة"], "carton": ["كرتون", "حبة"], "form_daily": "الجرد اليومي", "form_pack": "جرد التغليف", "form_corr": "تصحيح جرد", "sec_water": "💧 الماء", "sec_zf": "🟫 مخزون مصنع زمزم", "sec_dmg": "⚠️ الدامج", "sec_items": "🧰 الأصناف", "submit": "إرسال", "form_err": "عبّئ كل الخانات (اكتب 0 إذا لا يوجد)", "unit_bottle": "عبوة"}, "en": {"pp": ["Packed 5L Water - Pallets", "pallets"], "pl": ["Packed 5L Water - Loose Bottles", "bottles"], "rp": ["Raw Water - Pallets", "pallets"], "zp": ["Zamzam Factory Pallets", "pallets"], "zi": ["Zamzam Factory Interlayers", "interlayers"], "dwg": ["Water Damage - Groups", "bottles"], "dwf": ["Water Damage - Factory 📷", "bottles"], "dcg": ["Carton Damage - Groups", "pcs"], "dcf": ["Carton Damage - Factory 📷", "pcs"], "dbg": ["Bag Damage - Groups", "pcs"], "dbf": ["Bag Damage - Factory 📷", "pcs"], "bags": ["Plastic Bags", "pcs"], "tape": ["Sealing Tape", "rolls"], "roll": ["Plastic Roll", "rolls"], "pal_z": ["Empty Pallets (Zamzam Factory)", "pcs"], "int_z": ["Interlayers (Zamzam Factory)", "pcs"], "pal_m": ["Empty Pallets (Al Musbah)", "pcs"], "int_m": ["Interlayers (Al Musbah)", "pcs"], "carton": ["Carton", "pcs"], "form_daily": "Daily Count", "form_pack": "Packaging Count", "form_corr": "Count Correction", "sec_water": "💧 Water", "sec_zf": "🟫 Zamzam Factory Stock", "sec_dmg": "⚠️ Damage", "sec_items": "🧰 Items", "submit": "Submit", "form_err": "Fill all fields (enter 0 if none)", "unit_bottle": "bottles"}, "ur": {"pp": ["پیک شدہ 5 لیٹر پانی - پیلٹس", "پیلٹ"], "pl": ["پیک شدہ 5 لیٹر پانی - الگ بوتلیں", "بوتل"], "rp": ["خام پانی - پیلٹس", "پیلٹ"], "zp": ["زمزم فیکٹری کے پیلٹس", "پیلٹ"], "zi": ["زمزم فیکٹری کے انٹرلیئرز", "انٹرلیئر"], "dwg": ["خراب پانی - گروپس", "بوتل"], "dwf": ["خراب پانی - فیکٹری 📷", "بوتل"], "dcg": ["خراب کارٹن - گروپس", "عدد"], "dcf": ["خراب کارٹن - فیکٹری 📷", "عدد"], "dbg": ["خراب بیگز - گروپس", "عدد"], "dbf": ["خراب بیگز - فیکٹری 📷", "عدد"], "bags": ["پلاسٹک بیگز", "عدد"], "tape": ["سیلنگ ٹیپ", "رول"], "roll": ["پلاسٹک رول", "رول"], "pal_z": ["خالی پیلٹس (زمزم فیکٹری)", "عدد"], "int_z": ["انٹرلیئرز (زمزم فیکٹری)", "عدد"], "pal_m": ["خالی پیلٹس (المصباح)", "عدد"], "int_m": ["انٹرلیئرز (المصباح)", "عدد"], "carton": ["کارٹن", "عدد"], "form_daily": "روزانہ گنتی", "form_pack": "پیکجنگ گنتی", "form_corr": "گنتی کی درستی", "sec_water": "💧 پانی", "sec_zf": "🟫 زمزم فیکٹری اسٹاک", "sec_dmg": "⚠️ خراب مال", "sec_items": "🧰 اشیاء", "submit": "جمع کریں", "form_err": "تمام خانے بھریں (نہ ہو تو 0 لکھیں)", "unit_bottle": "بوتل"}, "bn": {"pp": ["প্যাকড ৫ লিটার পানি - প্যালেট", "প্যালেট"], "pl": ["প্যাকড ৫ লিটার পানি - আলাদা বোতল", "বোতল"], "rp": ["কাঁচা পানি - প্যালেট", "প্যালেট"], "zp": ["জমজম ফ্যাক্টরির প্যালেট", "প্যালেট"], "zi": ["জমজম ফ্যাক্টরির ইন্টারলেয়ার", "ইন্টারলেয়ার"], "dwg": ["পানি ক্ষতি - গ্রুপ", "বোতল"], "dwf": ["পানি ক্ষতি - ফ্যাক্টরি 📷", "বোতল"], "dcg": ["কার্টন ক্ষতি - গ্রুপ", "পিস"], "dcf": ["কার্টন ক্ষতি - ফ্যাক্টরি 📷", "পিস"], "dbg": ["ব্যাগ ক্ষতি - গ্রুপ", "পিস"], "dbf": ["ব্যাগ ক্ষতি - ফ্যাক্টরি 📷", "পিস"], "bags": ["প্লাস্টিক ব্যাগ", "পিস"], "tape": ["সিলিং টেপ", "রোল"], "roll": ["প্লাস্টিক রোল", "রোল"], "pal_z": ["খালি প্যালেট (জমজম ফ্যাক্টরি)", "পিস"], "int_z": ["ইন্টারলেয়ার (জমজম ফ্যাক্টরি)", "পিস"], "pal_m": ["খালি প্যালেট (আল মুসবাহ)", "পিস"], "int_m": ["ইন্টারলেয়ার (আল মুসবাহ)", "পিস"], "carton": ["কার্টন", "পিস"], "form_daily": "দৈনিক গণনা", "form_pack": "প্যাকেজিং গণনা", "form_corr": "গণনা সংশোধন", "sec_water": "💧 পানি", "sec_zf": "🟫 জমজম ফ্যাক্টরি স্টক", "sec_dmg": "⚠️ ক্ষতিগ্রস্ত", "sec_items": "🧰 আইটেম", "submit": "জমা দিন", "form_err": "সব ঘর পূরণ করুন (না থাকলে 0 লিখুন)", "unit_bottle": "বোতল"}}, "G": {"daily": [["sec_water", ["pp", "pl", "rp"]], ["sec_zf", ["zp", "zi"]], ["sec_dmg", ["dwg", "dwf", "dcg", "dcf", "dbg", "dbf"]]], "pack": [["sec_items", ["bags", "tape", "roll", "pal_z", "int_z", "pal_m", "int_m", "carton"]]], "corr": [["sec_water", ["pp", "pl", "rp"]], ["sec_zf", ["zp", "zi"]], ["sec_dmg", ["dwg", "dwf", "dcg", "dcf", "dbg", "dbf"]]]}, "P": {"pp": 168, "rp": 126}};
var C;
try{C=dec(new URLSearchParams(location.search).get('c'));}
catch(e){document.body.innerHTML='<p style="padding:24px;text-align:center">Please open this form from the ZamZam WH bot.</p>';throw e;}
if(!C.sections){
  var lang=D.L[C.l]?C.l:'en',T=D.L[lang],mode=C.m;
  C={mode:mode,lang:lang,rtl:(lang==='ar'||lang==='ur'),sub:C.s||'',values:C.v||{},
     title:T[mode==='pack'?'form_pack':(mode==='corr'?'form_corr':'form_daily')],
     submit:T.submit,err:T.form_err,unitWord:T.unit_bottle,
     sections:D.G[mode].map(function(g){return {title:T[g[0]],fields:g[1].map(function(k){var f={k:k,label:T[k][0],unit:T[k][1]};if(D.P[k])f.per=D.P[k];return f;})};})};
}
document.documentElement.dir=C.rtl?'rtl':'ltr';
document.documentElement.lang=C.lang||'en';
document.getElementById('title').textContent=C.title;
document.getElementById('sub').textContent=C.sub||'';
var form=document.getElementById('form');
var fields=[];
C.sections.forEach(function(sec){
  var d=document.createElement('div');d.className='sec';
  if(sec.title){d.innerHTML='<div class="st">'+esc(sec.title)+'</div>';}
  sec.fields.forEach(function(x){
    fields.push(x);
    var r=document.createElement('div');r.className='row';
    r.innerHTML='<label for="'+x.k+'">'+esc(x.label)+'<span class="u">'+esc(x.unit||'')+'<span id="c_'+x.k+'"></span></span></label>'+
      '<input id="'+x.k+'" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="0">';
    d.appendChild(r);
  });
  form.appendChild(d);
});
var AR='٠١٢٣٤٥٦٧٨٩',FA='۰۱۲۳۴۵۶۷۸۹',BN='০১২৩৪৫৬৭৮৯';
function norm(v){return v.replace(/[٠-٩]/g,function(d){return AR.indexOf(d);}).replace(/[۰-۹]/g,function(d){return FA.indexOf(d);}).replace(/[০-৯]/g,function(d){return BN.indexOf(d);}).replace(/\D/g,'').slice(0,7);}
function calc(x){
  if(!x.per)return;
  var v=parseInt(document.getElementById(x.k).value,10);
  document.getElementById('c_'+x.k).textContent=isNaN(v)?'':'  =  '+(v*x.per).toLocaleString('en')+' '+(C.unitWord||'');
}
fields.forEach(function(x){
  var i=document.getElementById(x.k);
  if(C.values&&C.values[x.k]!=null){i.value=C.values[x.k];}
  i.addEventListener('input',function(){i.value=norm(i.value);i.classList.remove('err');document.getElementById('msg').textContent='';calc(x);});
  calc(x);
});
var sent=false;
function submit(){
  if(sent)return;
  var ok=true,v={};
  fields.forEach(function(x){var i=document.getElementById(x.k);if(i.value===''){i.classList.add('err');ok=false;}else{v[x.k]=parseInt(i.value,10);}});
  if(!ok){
    document.getElementById('msg').textContent=C.err;
    if(tg&&tg.HapticFeedback){tg.HapticFeedback.notificationOccurred('error');}
    return;
  }
  sent=true;
  var data=JSON.stringify({m:C.mode,v:v});
  if(tg&&tg.sendData){tg.sendData(data);}
}
var fb=document.getElementById('fb');
fb.textContent=C.submit;fb.onclick=submit;
if(tg&&tg.initData!==undefined&&tg.platform&&tg.platform!=='unknown'){
  tg.ready();tg.expand();
  tg.MainButton.setText(C.submit);tg.MainButton.show();tg.MainButton.onClick(submit);
}else{fb.style.display='block';}
</script>
</body>
</html>
