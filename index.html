<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZamZam WH</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --text:var(--tg-theme-text-color,#111111);
  --hint:var(--tg-theme-hint-color,#8a8a8e);
  --sec:var(--tg-theme-secondary-bg-color,#f2f2f7);
  --btn:var(--tg-theme-button-color,#2a7ae2);
  --btnt:var(--tg-theme-button-text-color,#ffffff);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--sec);color:var(--text);padding-bottom:30px}
header{padding:20px 16px 8px;text-align:center}
h1{font-size:21px;margin:0}
.sub{color:var(--hint);font-size:13px;margin-top:5px}
.sec{background:var(--bg);margin:12px;border-radius:14px;padding:4px 14px}
.st{font-size:13px;color:var(--hint);margin:12px 0 4px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(128,128,128,.15);gap:12px}
.row:last-child{border-bottom:none}
label{flex:1;font-size:16px;line-height:1.35}
.u{font-size:12px;color:var(--hint);display:block;margin-top:2px}
input{width:112px;font-size:21px;padding:9px 6px;border-radius:10px;border:1.5px solid rgba(128,128,128,.35);background:var(--sec);color:var(--text);text-align:center;outline:none}
input:focus{border-color:var(--btn)}
input.err{border-color:#e53935;background:rgba(229,57,53,.08)}
.msg{color:#e53935;text-align:center;font-size:14px;min-height:20px;margin:8px 16px}
.fallback{display:none;margin:12px;padding:15px;width:calc(100% - 24px);font-size:17px;font-weight:600;border:0;border-radius:12px;background:var(--btn);color:var(--btnt)}
</style>
</head>
<body>
<header><h1 id="title"></h1><div class="sub" id="sub"></div></header>
<div id="form"></div>
<div class="msg" id="msg"></div>
<button class="fallback" id="fb"></button>
<script>
var tg = window.Telegram && window.Telegram.WebApp;
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var C;
try{C=dec(new URLSearchParams(location.search).get('c'));}
catch(e){document.body.innerHTML='<p style="padding:24px;text-align:center">Please open this form from the ZamZam WH bot.</p>';throw e;}
document.documentElement.dir=C.rtl?'rtl':'ltr';
document.documentElement.lang=C.lang||'en';
document.getElementById('title').textContent=C.title;
document.getElementById('sub').textContent=C.sub||'';
var form=document.getElementById('form');
var fields=[];
C.sections.forEach(function(sec){
  var d=document.createElement('div');d.className='sec';
  if(sec.title){d.innerHTML='<div class="st">'+esc(sec.title)+'</div>';}
  sec.fields.forEach(function(x){
    fields.push(x);
    var r=document.createElement('div');r.className='row';
    r.innerHTML='<label for="'+x.k+'">'+esc(x.label)+'<span class="u">'+esc(x.unit||'')+'<span id="c_'+x.k+'"></span></span></label>'+
      '<input id="'+x.k+'" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="0">';
    d.appendChild(r);
  });
  form.appendChild(d);
});
var AR='٠١٢٣٤٥٦٧٨٩',FA='۰۱۲۳۴۵۶۷۸۹',BN='০১২৩৪৫৬৭৮৯';
function norm(v){return v.replace(/[٠-٩]/g,function(d){return AR.indexOf(d);}).replace(/[۰-۹]/g,function(d){return FA.indexOf(d);}).replace(/[০-৯]/g,function(d){return BN.indexOf(d);}).replace(/\D/g,'').slice(0,7);}
function calc(x){
  if(!x.per)return;
  var v=parseInt(document.getElementById(x.k).value,10);
  document.getElementById('c_'+x.k).textContent=isNaN(v)?'':'  =  '+(v*x.per).toLocaleString('en')+' '+(C.unitWord||'');
}
fields.forEach(function(x){
  var i=document.getElementById(x.k);
  if(C.values&&C.values[x.k]!=null){i.value=C.values[x.k];}
  i.addEventListener('input',function(){i.value=norm(i.value);i.classList.remove('err');document.getElementById('msg').textContent='';calc(x);});
  calc(x);
});
var sent=false;
function submit(){
  if(sent)return;
  var ok=true,v={};
  fields.forEach(function(x){var i=document.getElementById(x.k);if(i.value===''){i.classList.add('err');ok=false;}else{v[x.k]=parseInt(i.value,10);}});
  if(!ok){
    document.getElementById('msg').textContent=C.err;
    if(tg&&tg.HapticFeedback){tg.HapticFeedback.notificationOccurred('error');}
    return;
  }
  sent=true;
  var data=JSON.stringify({m:C.mode,v:v});
  if(tg&&tg.sendData){tg.sendData(data);}
}
var fb=document.getElementById('fb');
fb.textContent=C.submit;fb.onclick=submit;
if(tg&&tg.initData!==undefined&&tg.platform&&tg.platform!=='unknown'){
  tg.ready();tg.expand();
  tg.MainButton.setText(C.submit);tg.MainButton.show();tg.MainButton.onClick(submit);
}else{fb.style.display='block';}
</script>
</body>
</html>
